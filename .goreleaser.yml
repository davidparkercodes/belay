version: 2
before:
  hooks:
    - go mod tidy
    - go vet ./...
builds:
  - id: darwin
    main: ./cmd/belay
    binary: belay
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
  - id: linux-windows
    main: ./cmd/belay
    binary: belay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}
archives:
  - format: tar.gz
    name_template: "belay_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: 'checksums.txt'
brews:
  - repository:
      owner: davidparkercodes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/davidparkercodes/belay"
    description: "AI-aware local version control for concurrent agent workflows"
    license: "MIT"
    install: |
      bin.install "belay"
    test: |
      system "#{bin}/belay", "--version"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
